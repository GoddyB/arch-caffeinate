name: hygiene
on:
  push:
    branches: [main]
  pull_request:
jobs:
  public-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check tracked files and new commit identities
        env:
          HYGIENE_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}^..{0}', github.sha) }}
        run: scripts/check-public-hygiene.sh
