name: hygiene
on:
  push:
    branches: [main]
  pull_request:
jobs:
  public-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: scripts/check-public-hygiene.sh
